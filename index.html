const N=['الفجر','الشروق','الظهر','العصر','المغرب','العشاء'];
const GM=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const HM=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
let S={on:[1,0,1,1,1,1]},fired='';
try{S=Object.assign(S,JSON.parse(localStorage.getItem('pt_set')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('pt_set',JSON.stringify(S))}catch(e){}};

function dayStr(d){const m=M[d.getMonth()],i=(d.getDate()-1)*24;return m&&m.length>=i+24?m.substr(i,24):null}
function times(d){const s=dayStr(d);if(!s)return null;const r=[];
  for(let i=0;i<6;i++){let h=+s.substr(i*4,2);const mi=+s.substr(i*4+2,2);
    if(i>=3&&h<12)h+=12;if(i==2&&h<=10)h+=12;
    const x=new Date(d);x.setHours(h,mi,0,0);r.push(x)}return r}
function f12(d){const h=d.getHours();return [pad(h%12||12)+':'+pad(d.getMinutes()),h<12?'AM':'PM']}
function nextP(now){for(let k=0;k<2;k++){const d=new Date(now);d.setDate(d.getDate()+k);const t=times(d);if(!t)return null;
  for(const i of [0,2,3,4,5])if(t[i]>now)return{i,t:t[i]}}return null}

let lastKey='';
function tick(){
  const now=new Date(),T=times(now),nx=nextP(now);
  $('#g').textContent=now.toLocaleDateString('ar',{weekday:'long'})+'، '+now.getDate()+' '+GM[now.getMonth()]+' '+now.getFullYear()+' م';
  try{const p=Object.fromEntries(new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(now).map(x=>[x.type,x.value]));
    $('#h').textContent=parseInt(p.day)+' '+HM[parseInt(p.month)-1]+' '+parseInt(p.year)+' هـ'}catch(e){}
  const key=now.toDateString()+(nx?nx.i:'x');
  if(key!==lastKey){lastKey=key;
    const RC=[81,221,351,481,610,738],DV=[155,286,418,544,672];
    $('#list').innerHTML=DV.map(y=>'<i class="dv" style="top:'+y+'px"></i>').join('')+(T?N.map((n,i)=>{const[a,b]=f12(T[i]);
      return '<div class="r'+(nx&&nx.i==i?' on':'')+'" style="top:'+(RC[i]-60)+'px"><div class="ic"><svg><use href="#i'+i+'"/></svg></div><div class="nm">'+n+'</div><div class="tm">'+a+'<small>'+b+'</small></div></div>'}).join(''):'');}
  if(nx){const s=Math.max(0,Math.floor((nx.t-now)/1000));
    $('#nn').textContent=N[nx.i];
    $('#c0').textContent=pad(Math.floor(s/3600));$('#c1').textContent=pad(Math.floor(s%3600/60));$('#c2').textContent=pad(s%60);
  }else{$('#nn').textContent='—';['#c0','#c1','#c2'].forEach(k=>$(k).textContent='--')}
  if(T)for(let i=0;i<6;i++){const k=now.toDateString()+i,df=now-T[i];
    if(S.on[i]&&df>=0&&df<60000&&fired!==k){fired=k;alarm(i)}}
}
function fit(){const w=innerWidth,h=innerHeight,k=Math.min(w/941,h/1672);$('#app').style.transform='translate('+(w-941*k)/2+'px,'+(h-1672*k)/2+'px) scale('+k+')'}
addEventListener('resize',fit);fit();
setInterval(tick,1000);

/* ---- audio ---- */
let au=new Audio(),ctx=null,bt=null;
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('pt',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result);q.onerror=j});
async function putF(b){try{const d=await idb();d.transaction('f','readwrite').objectStore('f').put(b,'a')}catch(e){}}
async function getF(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('f').objectStore('f').get('a');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){}}
getF().then(b=>{if(b){au.src=URL.createObjectURL(b);$('#fn').textContent='الصوت المحدد: '+(S.fname||'ملف مخصص')}else $('#fn').textContent='لم يتم اختيار صوت (سيُستخدم صوت تنبيه بسيط).'});
$('#fa').onchange=async e=>{const f=e.target.files[0];if(!f)return;await putF(f);au.src=URL.createObjectURL(f);S.fname=f.name;save();$('#fn').textContent='الصوت المحدد: '+f.name};
function beep(){try{ctx=ctx||new AudioContext();let n=0;clearInterval(bt);bt=setInterval(()=>{if(n++>8){clearInterval(bt);return}
  const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=660;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.3,ctx.currentTime);o.start();o.stop(ctx.currentTime+.4)},700)}catch(e){}}
function play(){if(au.src){au.currentTime=0;au.play().catch(beep)}else beep()}
function stopA(){au.pause();clearInterval(bt);$('#ban').style.display='none'}
au.onended=()=>{$('#ban').style.display='none'};
function alarm(i){const m=i==1?'حان وقت الشروق':'حان الآن وقت صلاة '+N[i];
  $('#bt').textContent=m;$('#ban').style.display='block';play();
  try{if(Notification.permission==='granted')new Notification(m,{body:'ناحية الزاب الأسفل',tag:'pt'+i})}catch(e){}}
async function enable(){let m='';
  try{ctx=ctx||new AudioContext();await ctx.resume();m+='تم تفعيل الصوت. '}catch(e){}
  try{const p=await Notification.requestPermission();m+=p==='granted'?'تم السماح بالإشعارات.':'الإشعارات غير مسموحة (سيعمل الصوت داخل الصفحة).'}catch(e){m+='الإشعارات غير مدعومة في هذا المتصفح.'}
  $('#en').textContent=m}

/* ---- settings ---- */
const op=v=>$('#st').style.display=v?'block':'none';
$('#sw').innerHTML=N.map((n,i)=>'<label class="sw">'+n+'<input type="checkbox" data-i="'+i+'" '+(S.on[i]?'checked':'')+'></label>').join('');
$('#sw').onchange=e=>{S.on[e.target.dataset.i]=e.target.checked?1:0;save()};
let wk=null;
$('#wl').onchange=async e=>{try{if(e.target.checked)wk=await navigator.wakeLock.request('screen');else if(wk){wk.release();wk=null}}catch(x){e.target.checked=false}};
tick();
</script>
